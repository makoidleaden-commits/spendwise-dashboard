<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpendWise Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <aside class="sidebar">
            <div class="logo">SpendWise</div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="#" class="nav-item">Transactions</a>
                <a href="#" class="nav-item">Budgets</a>
                <a href="#" class="nav-item">Reports</a>
                <a href="#" class="nav-item">Settings</a>
            </nav>
        </aside>

        <header class="header">
            <h1>Dashboard Overview</h1>
            <div class="header-actions">
                <span class="user-name">Hi, Amina</span>
                <div class="avatar">A</div>
            </div>
        </header>

        <main class="cards-grid">
            <div class="card" tabindex="0">
                <div class="card-icon">🍔</div>
                <h2>Food</h2>
                <p class="amount">$320.50</p>
                <p class="card-sub">This month</p>
            </div>
            <div class="card" tabindex="0">
                <div class="card-icon">🚌</div>
                <h2>Transport</h2>
                <p class="amount">$120.00</p>
                <p class="card-sub">This month</p>
            </div>
            <div class="card" tabindex="0">
                <div class="card-icon">🏠</div>
                <h2>Rent</h2>
                <p class="amount">$800.00</p>
                <p class="card-sub">This month</p>
            </div>
            <div class="card" tabindex="0">
                <div class="card-icon">🎬</div>
                <h2>Entertainment</h2>
                <p class="amount">$65.99</p>
                <p class="card-sub">This month</p>
            </div>
            <div class="card" tabindex="0">
                <div class="card-icon">💰</div>
                <h2>Savings</h2>
                <p class="amount">$500.00</p>
                <p class="card-sub">This month</p>
            </div>
            <div class="card" tabindex="0">
                <div class="card-icon">💡</div>
                <h2>Utilities</h2>
                <p class="amount">$95.40</p>
                <p class="card-sub">This month</p>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
